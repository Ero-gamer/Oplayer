name: Android CI Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build armv7a APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Generate Temporary Debug Keystore
        id: debug_signing
        shell: bash
        run: |
          keystore_path="${RUNNER_TEMP}/debug.keystore"
          keytool -genkey -v -keystore "${keystore_path}" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "keystore_path=${keystore_path}" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        env:
          KEYSTORE_PATH: ${{ steps.debug_signing.outputs.keystore_path }}
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: python scripts/build.py build-apk --abi armeabi-v7a --clean

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Media3-Player-armv7a-${{ github.sha }}
          path: build/apk/*.apk
