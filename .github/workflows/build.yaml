name: Android CI Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build armv7a APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'

      - name: Build Debug APK
        run: python scripts/build.py build-apk --abi armeabi-v7a --build-type debug --clean

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Media3-Player-armv7a-${{ github.sha }}
          path: build/apk/
          if-no-files-found: error
